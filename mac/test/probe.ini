# Config used by test/run.sh. The probe is never the frontmost app, hence Always.
!Always = true
!Debug = true

W : %L.Up
A : %L.Left
Space : %A
LShift : %B
F : %Extra
T : %X !Turbo ^0.05

LButton : %RT
RButton : %LT ~0.5

Mouse.Left : %R.Left ~0.05 ^0.1
Mouse.Right : %R.Right ~0.05 ^0.1
Mouse.Up : %R.Up ~0.05 ^0.1
Mouse.Down : %R.Down ~0.05 ^0.1
Wheel.Up : %D.Up ^0.1

Q : Tab
Tab : %Y
G : RButton
H : Wheel.Down ^0.05
F8 : ToggleDisable
