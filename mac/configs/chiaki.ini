##############################################################################################################
# chiaki-ng (PS5 / PS4 Remote Play) on macOS: keyboard + mouse as a controller.
#
# This file is picked up automatically for chiaki-ng, because its executable is named "chiaki".
# The syntax is described at the top of _default.ini.
#
# Mappings start DISABLED, so chiaki-ng's own menus work normally with the mouse.
# Once the stream is on screen, press Right Option to turn them on (this also captures the mouse),
# and press it again to get your cursor back.
#
# PlayStation buttons go by their Xbox names here:
#   %A = Cross      %B = Circle     %X = Square     %Y = Triangle
#   %LB = L1        %RB = R1        %LT = L2        %RT = R2
#   %L = L3         %R = R3         %Start = Options   %Back = Create
#   %Guide = PS button              %Extra = Touchpad click
#
# The layout follows GTA 6's default control scheme, with the keys a PC GTA player expects.
# Change anything: the file is reloaded when you switch back to chiaki-ng.
#
# ON FOOT and DRIVING
# A controller uses the same buttons for different things on foot and in a vehicle (R2 shoots, or
# accelerates), and MyInput can't see which one you're in. So there are two modes:
#   F          enters or exits a vehicle, and switches mode. Use it only for vehicles.
#   E          is the same button (Triangle) without switching: doors, items, people.
#   Caps Lock  switches mode by hand, for when it's out of step with the game
#              (you were thrown out of a car, a mission put you in one, F didn't get you in).
##############################################################################################################

!Disable = true
!HideCursor = true
RAlt : ToggleDisable

# ---- Both modes ----

A : %L.Left
D : %L.Right

# Look. The stick is pushed further the longer a mouse stroke gets, and recenters when the mouse stops.
#   ~ is how much stick each pixel of movement adds: raise it for a faster camera.
#   ^ is how long (in seconds) the mouse has to rest before the stick recenters.
Mouse.Left : %R.Left ~0.02 ^0.04 !Add
Mouse.Right : %R.Right ~0.02 ^0.04 !Add
Mouse.Up : %R.Up ~0.02 ^0.04 !Add
Mouse.Down : %R.Down ~0.02 ^0.04 !Add

# Cross: jump and climb on foot, handbrake in a vehicle
Space : %A
# L3: run on foot (press again to sprint), horn and nitrous in a vehicle
LShift : %L
# Square: punch and kick (hold for a heavy attack)
R : %X
# Circle: crouch on foot, headlights in a vehicle
LControl : %B
# Triangle: interact, and enter or exit vehicles (see the top of this file)
F : %Y
E : %Y
# L1: holster (hold for the weapon loadout)
Tab : %LB
# R3: look behind
C : %R
MButton : %R

# D-pad: phone, radio, objective
Up : %D.Up
Down : %D.Down
Left : %D.Left
Right : %D.Right

# Touchpad click (map), Options (pause), PS button
M : %Extra
Escape : %Start
Backquote1 : %Guide

# ---- On foot ----

W : %L.Up ?((^F & ^CapsLock) | (^~F & ^~CapsLock))
S : %L.Down ?((^F & ^CapsLock) | (^~F & ^~CapsLock))
# R2 shoots, L2 aims, R1 takes cover
LButton : %RT ?((^F & ^CapsLock) | (^~F & ^~CapsLock))
RButton : %LT ?((^F & ^CapsLock) | (^~F & ^~CapsLock))
Q : %RB ?((^F & ^CapsLock) | (^~F & ^~CapsLock))

# ---- Driving ----

# R2 accelerates, L2 brakes and reverses
W : %RT ?((^F & ^~CapsLock) | (^~F & ^CapsLock))
S : %LT ?((^F & ^~CapsLock) | (^~F & ^CapsLock))
# R1 shoots from a vehicle
LButton : %RB ?((^F & ^~CapsLock) | (^~F & ^CapsLock))
RButton : None ?((^F & ^~CapsLock) | (^~F & ^CapsLock))
